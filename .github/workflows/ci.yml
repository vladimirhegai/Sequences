name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:perf
      - name: Golden render determinism
        run: npm run test:golden
      - name: Primitive probe thumbnails
        run: node apps/sequences/src/cli.ts thumbs fixtures/sequences/starter --primitives
