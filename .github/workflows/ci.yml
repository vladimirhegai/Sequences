name: CI

on:
  push:
  pull_request:

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:perf
      - name: Golden render determinism
        run: npm run test:golden
      - name: Primitive probe thumbnails
        run: node apps/studio/src/cli.ts thumbs projects/Starter --primitives
