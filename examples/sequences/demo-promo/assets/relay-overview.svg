<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C8DFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5C8DFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E9BFF"/>
      <stop offset="1" stop-color="#9FC0FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#0C0E12"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="210" height="900" fill="#0F1217"/>
  <line x1="210" y1="0" x2="210" y2="900" stroke="#1E232B"/>
  <rect x="26" y="34" width="16" height="16" rx="4" fill="#5C8DFF"/>
  <text x="54" y="47" fill="#E7EAEF" font-size="19" font-weight="700">Relay</text>
  <rect x="16" y="86" width="178" height="40" rx="9" fill="#171B22"/>
  <rect x="34" y="99" width="15" height="15" rx="3" fill="#5C8DFF"/>
  <text x="62" y="111" fill="#E7EAEF" font-size="15" font-weight="600">Overview</text>
  <g fill="#7A828C" font-size="15" font-weight="500">
    <rect x="34" y="147" width="15" height="15" rx="3" fill="#2A2F38"/><text x="62" y="159">Services</text>
    <rect x="34" y="191" width="15" height="15" rx="3" fill="#2A2F38"/><text x="62" y="203">Traces</text>
    <rect x="34" y="235" width="15" height="15" rx="3" fill="#2A2F38"/><text x="62" y="247">Alerts</text>
    <rect x="34" y="279" width="15" height="15" rx="3" fill="#2A2F38"/><text x="62" y="291">Deploys</text>
  </g>

  <!-- header -->
  <text x="236" y="60" fill="#E7EAEF" font-size="24" font-weight="700">Production overview</text>
  <rect x="930" y="38" width="150" height="36" rx="9" fill="#14181F" stroke="#242A33"/>
  <text x="952" y="61" fill="#9AA2AD" font-size="14" font-weight="500">Last 24 hours</text>
  <circle cx="1140" cy="56" r="18" fill="#2A3340"/>
  <text x="1140" y="61" fill="#9FC0FF" font-size="14" font-weight="700" text-anchor="middle">AK</text>

  <!-- KPI tiles -->
  <g>
    <rect x="236" y="100" width="294" height="132" rx="14" fill="#14171D" stroke="#20242B"/>
    <text x="260" y="136" fill="#7A828C" font-size="14" font-weight="600">Uptime</text>
    <text x="260" y="184" fill="#E7EAEF" font-size="42" font-weight="800">99.98%</text>
    <rect x="260" y="200" width="58" height="22" rx="6" fill="#173026"/>
    <text x="272" y="215" fill="#5BC98B" font-size="13" font-weight="700">+0.02</text>
  </g>
  <g>
    <rect x="551" y="100" width="294" height="132" rx="14" fill="#14171D" stroke="#20242B"/>
    <text x="575" y="136" fill="#7A828C" font-size="14" font-weight="600">p99 latency</text>
    <text x="575" y="184" fill="#E7EAEF" font-size="42" font-weight="800">142<tspan font-size="22" fill="#7A828C">ms</tspan></text>
    <rect x="575" y="200" width="62" height="22" rx="6" fill="#173026"/>
    <text x="587" y="215" fill="#5BC98B" font-size="13" font-weight="700">-18%</text>
  </g>
  <g>
    <rect x="866" y="100" width="294" height="132" rx="14" fill="#14171D" stroke="#20242B"/>
    <text x="890" y="136" fill="#7A828C" font-size="14" font-weight="600">Error rate</text>
    <text x="890" y="184" fill="#E7EAEF" font-size="42" font-weight="800">0.04%</text>
    <rect x="890" y="200" width="58" height="22" rx="6" fill="#301A1A"/>
    <text x="902" y="215" fill="#E0705E" font-size="13" font-weight="700">+0.01</text>
  </g>

  <!-- chart card -->
  <rect x="236" y="256" width="580" height="308" rx="14" fill="#14171D" stroke="#20242B"/>
  <text x="260" y="294" fill="#E7EAEF" font-size="17" font-weight="700">Request latency</text>
  <text x="260" y="316" fill="#7A828C" font-size="13" font-weight="500">p50 / p95 / p99 · ms</text>
  <g stroke="#1C2129">
    <line x1="260" y1="364" x2="792" y2="364"/>
    <line x1="260" y1="424" x2="792" y2="424"/>
    <line x1="260" y1="484" x2="792" y2="484"/>
  </g>
  <path d="M260,508 L313,492 L366,514 L419,452 L472,470 L525,420 L578,436 L631,384 L684,404 L737,360 L792,376 L792,524 L260,524 Z" fill="url(#area)"/>
  <path d="M260,508 L313,492 L366,514 L419,452 L472,470 L525,420 L578,436 L631,384 L684,404 L737,360 L792,376" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260,520 L313,514 L366,522 L419,500 L472,508 L525,488 L578,494 L631,474 L684,482 L737,464 L792,470" fill="none" stroke="#2E3540" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="737" cy="360" r="5" fill="#9FC0FF"/>

  <!-- recent deploys card -->
  <rect x="840" y="256" width="320" height="308" rx="14" fill="#14171D" stroke="#20242B"/>
  <text x="864" y="294" fill="#E7EAEF" font-size="17" font-weight="700">Recent deploys</text>
  <g font-size="14">
    <circle cx="870" cy="334" r="5" fill="#5BC98B"/>
    <text x="888" y="339" fill="#D2D7DE" font-weight="600">api · v2.14.0</text>
    <text x="1136" y="339" fill="#7A828C" text-anchor="end" font-weight="500">2m</text>
    <circle cx="870" cy="378" r="5" fill="#5BC98B"/>
    <text x="888" y="383" fill="#D2D7DE" font-weight="600">web · v8.2.1</text>
    <text x="1136" y="383" fill="#7A828C" text-anchor="end" font-weight="500">19m</text>
    <circle cx="870" cy="422" r="5" fill="#E0B05E"/>
    <text x="888" y="427" fill="#D2D7DE" font-weight="600">worker · v1.9.3</text>
    <text x="1136" y="427" fill="#7A828C" text-anchor="end" font-weight="500">41m</text>
    <circle cx="870" cy="466" r="5" fill="#5BC98B"/>
    <text x="888" y="471" fill="#D2D7DE" font-weight="600">api · v2.13.9</text>
    <text x="1136" y="471" fill="#7A828C" text-anchor="end" font-weight="500">1h</text>
  </g>
  <rect x="864" y="500" width="272" height="42" rx="10" fill="#1A2740" stroke="#2B3F66"/>
  <text x="1000" y="526" fill="#9FC0FF" font-size="14" font-weight="700" text-anchor="middle">View all deploys</text>

  <!-- services table -->
  <rect x="236" y="588" width="924" height="276" rx="14" fill="#14171D" stroke="#20242B"/>
  <text x="260" y="626" fill="#E7EAEF" font-size="17" font-weight="700">Services</text>
  <g font-size="13" fill="#5C636E" font-weight="600">
    <text x="260" y="664">SERVICE</text>
    <text x="640" y="664">p99</text>
    <text x="820" y="664">ERROR</text>
    <text x="1010" y="664">STATUS</text>
  </g>
  <line x1="260" y1="678" x2="1136" y2="678" stroke="#1C2129"/>
  <g font-size="15">
    <text x="260" y="710" fill="#D2D7DE" font-weight="600">checkout-api</text>
    <text x="640" y="710" fill="#9AA2AD">142ms</text>
    <text x="820" y="710" fill="#9AA2AD">0.04%</text>
    <circle cx="1018" cy="705" r="5" fill="#5BC98B"/><text x="1034" y="710" fill="#5BC98B" font-weight="600">Healthy</text>

    <text x="260" y="752" fill="#D2D7DE" font-weight="600">payments</text>
    <text x="640" y="752" fill="#9AA2AD">581ms</text>
    <text x="820" y="752" fill="#E0B05E">0.21%</text>
    <circle cx="1018" cy="747" r="5" fill="#E0B05E"/><text x="1034" y="752" fill="#E0B05E" font-weight="600">Degraded</text>

    <text x="260" y="794" fill="#D2D7DE" font-weight="600">search</text>
    <text x="640" y="794" fill="#9AA2AD">88ms</text>
    <text x="820" y="794" fill="#9AA2AD">0.01%</text>
    <circle cx="1018" cy="789" r="5" fill="#5BC98B"/><text x="1034" y="794" fill="#5BC98B" font-weight="600">Healthy</text>

    <text x="260" y="836" fill="#D2D7DE" font-weight="600">notifications</text>
    <text x="640" y="836" fill="#9AA2AD">63ms</text>
    <text x="820" y="836" fill="#9AA2AD">0.02%</text>
    <circle cx="1018" cy="831" r="5" fill="#5BC98B"/><text x="1034" y="836" fill="#5BC98B" font-weight="600">Healthy</text>
  </g>
</svg>
