<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="slow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5A94E"/>
      <stop offset="1" stop-color="#E0B05E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#0C0E12"/>

  <!-- header -->
  <text x="40" y="62" fill="#E7EAEF" font-size="24" font-weight="700">Trace</text>
  <text x="116" y="62" fill="#7A828C" font-size="22" font-weight="500">POST /checkout</text>
  <rect x="952" y="36" width="208" height="40" rx="10" fill="#301F12" stroke="#5A4222"/>
  <circle cx="980" cy="56" r="5" fill="#E5A94E"/>
  <text x="996" y="62" fill="#E5C98E" font-size="15" font-weight="700">1.24s · degraded</text>

  <!-- panel -->
  <rect x="32" y="100" width="1136" height="756" rx="16" fill="#0F1217" stroke="#1E232B"/>

  <!-- time axis -->
  <g stroke="#1C2129">
    <line x1="280" y1="150" x2="280" y2="788"/>
    <line x1="551" y1="150" x2="551" y2="788"/>
    <line x1="822" y1="150" x2="822" y2="788"/>
    <line x1="1093" y1="150" x2="1093" y2="788"/>
  </g>
  <g fill="#5C636E" font-size="13" font-weight="600">
    <text x="280" y="140">0s</text>
    <text x="551" y="140">0.4s</text>
    <text x="822" y="140">0.8s</text>
    <text x="1093" y="140">1.2s</text>
  </g>

  <!-- span rows -->
  <g font-size="15">
    <text x="56" y="188" fill="#D2D7DE" font-weight="700">gateway</text>
    <rect x="280" y="170" width="840" height="26" rx="6" fill="#171B22" stroke="#262C35"/>
    <text x="1112" y="188" fill="#7A828C" text-anchor="end" font-weight="600">1.24s</text>

    <text x="72" y="274" fill="#9AA2AD" font-weight="600">auth.verify</text>
    <rect x="294" y="256" width="66" height="26" rx="6" fill="#3F5C9E"/>
    <text x="372" y="274" fill="#7A828C" font-weight="600">98ms</text>

    <text x="72" y="360" fill="#9AA2AD" font-weight="600">cart.load</text>
    <rect x="375" y="342" width="108" height="26" rx="6" fill="#3F5C9E"/>
    <text x="495" y="360" fill="#7A828C" font-weight="600">160ms</text>

    <text x="72" y="446" fill="#9AA2AD" font-weight="600">inventory.check</text>
    <rect x="483" y="428" width="81" height="26" rx="6" fill="#3F5C9E"/>
    <text x="576" y="446" fill="#7A828C" font-weight="600">120ms</text>

    <text x="72" y="532" fill="#E5C98E" font-weight="700">payment.charge</text>
    <rect x="578" y="513" width="393" height="30" rx="7" fill="url(#slow)"/>
    <rect x="578" y="513" width="393" height="30" rx="7" fill="none" stroke="#F0C878" stroke-opacity="0.5"/>
    <text x="983" y="533" fill="#E5C98E" font-weight="700">581ms</text>
    <rect x="589" y="556" width="150" height="24" rx="6" fill="#301F12" stroke="#5A4222"/>
    <text x="601" y="573" fill="#E5A94E" font-size="12" font-weight="700">47% of total</text>

    <text x="72" y="618" fill="#9AA2AD" font-weight="600">db.write</text>
    <rect x="984" y="600" width="81" height="26" rx="6" fill="#3F5C9E"/>
    <text x="1077" y="618" fill="#7A828C" font-weight="600">120ms</text>

    <text x="72" y="704" fill="#9AA2AD" font-weight="600">notify.queue</text>
    <rect x="1066" y="686" width="41" height="26" rx="6" fill="#3F5C9E"/>
    <text x="1112" y="704" fill="#7A828C" text-anchor="end" font-weight="600">60ms</text>
  </g>

  <!-- footer -->
  <line x1="32" y1="752" x2="1168" y2="752" stroke="#1A1E25"/>
  <circle cx="64" cy="800" r="5" fill="#E5A94E"/>
  <text x="82" y="805" fill="#9AA2AD" font-size="15" font-weight="600">Root cause</text>
  <text x="190" y="805" fill="#5C636E" font-size="15" font-weight="500">payment.charge — downstream gateway timeout retries</text>
</svg>
